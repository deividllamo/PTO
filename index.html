<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetradoPlugin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F17; --card:#131A26; --card2:#0F1520; --line:#212B3B;
    --text:#F2F4F7; --muted:#8A94A6; --muted2:#5C6577;
    --green:#22C55E; --green-bg:#12281C;
    --red:#EF4444; --red-bg:#2A1518;
    --blue:#3B82F6; --blue-bg:#0F1E33;
    --purple:#A855F7; --purple-bg:#1F1530;
    --amber:#F5A623; --amber-bg:#2A2010;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding-bottom:60px;}
  h1,h2,h3,.disp{font-family:'Poppins',sans-serif;}

  header{padding:18px 18px 0; display:flex; align-items:center; gap:12px;}
  .app-icon{width:46px; height:46px; border-radius:12px; background:var(--blue); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;}
  header .titles{flex:1;}
  header h1{font-size:19px; font-weight:700; margin:0;}
  header .sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--green); display:inline-block; margin-right:5px;}

  nav.tabs{display:flex; margin:16px 18px 0; border-bottom:1px solid var(--line); gap:22px;}
  nav.tabs button{background:none; border:none; color:var(--muted); font-family:'Inter',sans-serif; font-size:14.5px; font-weight:500; padding:0 0 12px; cursor:pointer; border-bottom:2px solid transparent;}
  nav.tabs button.active{color:var(--text); border-bottom-color:var(--blue); font-weight:600;}

  main{padding:18px;}
  section.tab{display:none;}
